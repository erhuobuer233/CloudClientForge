<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>@@PRODUCT@@</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      .card {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 24px;
        border: 1px solid rgba(160, 180, 255, 0.2);
        background:
          radial-gradient(120% 120% at 15% 0%, rgba(124, 139, 255, 0.32), transparent 55%),
          radial-gradient(100% 100% at 100% 10%, rgba(176, 123, 255, 0.26), transparent 55%),
          linear-gradient(165deg, #0b1020 0%, #0e1430 55%, #0a0f1e 100%);
        box-shadow: 0 20px 55px rgba(0, 0, 0, 0.55);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 22px;
        transition: opacity 0.22s ease, transform 0.22s ease;
        animation: in 0.35s cubic-bezier(0.2, 0.9, 0.2, 1);
      }
      .card.hide {
        opacity: 0;
        transform: scale(0.97);
      }
      @keyframes in {
        from { opacity: 0; transform: scale(0.96); }
      }
      .icon {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        margin-bottom: 6px;
        -webkit-user-drag: none;
      }
      .name {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #eef1ff;
      }
      .sub {
        font-size: 11px;
        color: #8a96bd;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }
      .bar {
        margin-top: 14px;
        width: 200px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #7c8bff, #b07bff);
        animation: sweep 1.25s ease-in-out infinite;
      }
      @keyframes sweep {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      .status {
        margin-top: 10px;
        font-size: 11.5px;
        color: #9aa6cd;
        min-height: 16px;
      }
      .foot {
        position: absolute;
        bottom: 12px;
        font-size: 9.5px;
        letter-spacing: 1.2px;
        color: rgba(140, 152, 190, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="icon" src="../assets/icon.png" alt="" draggable="false" />
      <div class="name">@@DISPLAY_NAME@@</div>
      <div class="sub">@@PRODUCT@@</div>
      <div class="bar"><i></i></div>
      <div class="status" id="status">正在启动…</div>
      <div class="foot">Powered by CloudClientForge</div>
    </div>
    <script>
      window.setStatus = function (text) {
        var el = document.getElementById('status');
        if (el && text) el.textContent = text;
      };
      window.hideSplash = function () {
        var card = document.querySelector('.card');
        if (card) card.classList.add('hide');
      };
    </script>
  </body>
</html>
