<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudClientForge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="launcher-body">
    <div id="window" class="launcher-window">
      <header class="titlebar">
        <div class="brand">
          <div class="logo small" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="16" height="16">
              <path
                d="M9 23.5h14a4.5 4.5 0 0 0 .7-8.95A6.5 6.5 0 0 0 11.4 13.4A4.8 4.8 0 0 0 9 23.5Z"
                fill="currentColor"
              />
            </svg>
          </div>
          <div class="brand-text">
            <strong>启动器</strong>
            <span>CloudClientForge</span>
          </div>
        </div>
        <div class="win-actions">
          <button id="btnTheme" class="win-btn text" title="切换到浅色主题">☀</button>
          <button id="btnMain" class="mini-btn strong win-main" type="button" title="打开生成客户端窗口">生成客户端</button>
          <button id="btnClose" class="win-btn close" title="关闭">
            <svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          </button>
        </div>
      </header>

      <main class="launcher-standalone">
        <div class="launcher-head">
          <div>
            <div class="launcher-title">已生成的客户端</div>
            <div class="launcher-sub" id="launcherSub">从 Cloudgame\ 扫到的成品，双击卡片或点「启动」直接运行</div>
          </div>
          <button id="btnRefreshClients" class="mini-btn" type="button">刷新</button>
        </div>

        <div id="clientList" class="client-list"></div>

        <div id="clientEmpty" class="empty hidden">
          <div class="empty-title">还没有生成任何客户端</div>
          <div class="empty-sub">点「生成客户端」粘一个云游戏网址，生成完这里就能一键启动。</div>
          <button id="btnOpenMain" class="mini-btn strong" type="button">生成客户端</button>
        </div>
        <footer class="launcher-foot">
          <span class="foot-ver" id="verText">v—</span>
          <span class="foot-sep">·</span>
          <span class="foot-update" id="updateText">检查更新中…</span>
          <button id="btnCheckUpdate" class="mini-btn ghost" type="button">检查更新</button>
        </footer>
      </main>
    </div>

    <script src="clients-view.js"></script>
    <script src="launcher.js"></script>
  </body>
</html>
